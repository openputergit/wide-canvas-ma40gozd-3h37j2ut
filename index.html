<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Planning System</title>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-gray-50">
    <div class="container mx-auto p-4 max-w-6xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">Budget Planning System</h1>

        <!-- Main Form -->
        <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block mb-2 text-sm font-medium">Department</label>
                    <select id="department" class="w-full p-2 border rounded focus:border-blue-500">
                        <option value="">Select Department</option>
                        <option value="R&D">R&D</option>
                        <option value="Finance">Finance</option>
                        <option value="HR">HR</option>
                        <option value="IT">IT</option>
                        <option value="Sales">Sales</option>
                        <option value="Production">Production</option>
                    </select>
                </div>
                <div>
                    <label class="block mb-2 text-sm font-medium">Budget Plan Number</label>
                    <select id="planNumber" class="w-full p-2 border rounded focus:border-blue-500">
                        <option value="">Select Plan Number</option>
                        <option value="P1 2025">P1 2025</option>
                        <option value="P2 2025">P2 2025</option>
                        <option value="P3 2025">P3 2025</option>
                        <option value="P4 2025">P4 2025</option>
                    </select>
                </div>
            </div>

            <!-- Budget Entry Table -->
            <div class="overflow-x-auto">
                <table class="w-full mb-4">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="p-2 text-left">GL Description</th>
                            <th class="p-2 text-left">GL Code</th>
                            <th class="p-2 text-left">2024</th>
                            <th class="p-2 text-left">2025</th>
                            <th class="p-2 text-left">2026</th>
                            <th class="p-2 text-left">2027</th>
                            <th class="p-2 text-left">2028</th>
                            <th class="p-2 text-left">2029</th>
                            <th class="p-2 text-left">Action</th>
                        </tr>
                    </thead>
                    <tbody id="budgetEntries"></tbody>
                </table>
            </div>

            <div class="flex gap-4 mb-6">
                <button onclick="addNewRow()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Add Row
                </button>
                <button onclick="removeAllRows()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                    Remove All
                </button>
                <button onclick="submitBudget()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                    Submit
                </button>
            </div>
        </div>

        <!-- Download Section -->
        <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
            <h2 class="text-xl font-bold mb-4">Download Budget Data</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <select id="downloadDepartment" class="p-2 border rounded">
                    <option value="">Select Department</option>
                    <option value="R&D">R&D</option>
                    <option value="Finance">Finance</option>
                    <option value="HR">HR</option>
                    <option value="IT">IT</option>
                    <option value="Sales">Sales</option>
                    <option value="Production">Production</option>
                </select>
                <select id="downloadPlanNumber" class="p-2 border rounded">
                    <option value="">Select Plan Number</option>
                    <option value="P1 2025">P1 2025</option>
                    <option value="P2 2025">P2 2025</option>
                    <option value="P3 2025">P3 2025</option>
                    <option value="P4 2025">P4 2025</option>
                </select>
                <input type="text" id="budgetSrNumber" placeholder="Budget Sr. Number" class="p-2 border rounded">
            </div>
            <button onclick="downloadData()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Download Excel
            </button>
        </div>

        <!-- Modify Section -->
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-bold mb-4">Modify Budget Data</h2>
            <div class="flex gap-4 mb-4">
                <input type="text" id="modifyBudgetSrNumber" placeholder="Enter Budget Sr. Number" class="p-2 border rounded flex-grow">
                <button onclick="loadBudgetData()" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600">
                    Load Data
                </button>
            </div>
        </div>
    </div>

    <script>
        const glMapping = {
            'Legal Fees': '1001',
            'Travel code': '1002',
            'Prototype cost': '1003',
            'Testing Exp': '1004',
            'Rejection cost': '1005'
        };

        let budgetSrCounter = 1;
        let savedBudgets = [];

        function addNewRow() {
            const tbody = document.getElementById('budgetEntries');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="p-2">
                    <select class="gl-description w-full border rounded" onchange="updateGLCode(this)">
                        <option value="">Select GL Description</option>
                        ${Object.keys(glMapping).map(desc => `<option value="${desc}">${desc}</option>`).join('')}
                    </select>
                </td>
                <td class="p-2"><input type="text" class="gl-code w-full border rounded" readonly></td>
                <td class="p-2"><input type="number" class="year-input w-full border rounded" min="0"></td>
                <td class="p-2"><input type="number" class="year-input w-full border rounded" min="0"></td>
                <td class="p-2"><input type="number" class="year-input w-full border rounded" min="0"></td>
                <td class="p-2"><input type="number" class="year-input w-full border rounded" min="0"></td>
                <td class="p-2"><input type="number" class="year-input w-full border rounded" min="0"></td>
                <td class="p-2"><input type="number" class="year-input w-full border rounded" min="0"></td>
                <td class="p-2">
                    <button onclick="removeRow(this)" class="text-red-500 hover:text-red-700">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(row);
        }

        function updateGLCode(select) {
            const row = select.closest('tr');
            const glCodeInput = row.querySelector('.gl-code');
            glCodeInput.value = glMapping[select.value] || '';
        }

        function removeRow(button) {
            button.closest('tr').remove();
        }

        function removeAllRows() {
            document.getElementById('budgetEntries').innerHTML = '';
        }

        function submitBudget() {
            const department = document.getElementById('department').value;
            const planNumber = document.getElementById('planNumber').value;

            if (!department || !planNumber) {
                alert('Please select department and plan number');
                return;
            }

            const entries = [];
            document.querySelectorAll('#budgetEntries tr').forEach(row => {
                const glDescription = row.querySelector('.gl-description').value;
                const glCode = row.querySelector('.gl-code').value;
                const yearInputs = Array.from(row.querySelectorAll('.year-input')).map(input => input.value);

                if (glDescription && glCode) {
                    entries.push({
                        glDescription,
                        glCode,
                        years: yearInputs
                    });
                }
            });

            if (entries.length === 0) {
                alert('Please add at least one budget entry');
                return;
            }

            const budgetSrNumber = String(budgetSrCounter).padStart(3, '0');
            const budgetData = {
                budgetSrNumber,
                department,
                planNumber,
                entries
            };

            savedBudgets.push(budgetData);
            budgetSrCounter++;

            // Save to MongoDB
            saveBudgetToMongoDB(budgetData);

            alert(`Budget submitted successfully! Budget Sr. Number: ${budgetSrNumber}`);
            removeAllRows();
        }

        async function saveBudgetToMongoDB(budgetData) {
            try {
                const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer cU3Bpb1ZjoVRFUrn9lCXbEM8cHm1',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        appSlug: 'budget-planning-123456',
                        action: 'create',
                        collection: 'budgets',
                        data: budgetData
                    })
                });
                const result = await response.json();
                console.log('Budget saved:', result);
            } catch (error) {
                console.error('Error saving budget:', error);
            }
        }

        function downloadData() {
            const department = document.getElementById('downloadDepartment').value;
            const planNumber = document.getElementById('downloadPlanNumber').value;
            const budgetSrNumber = document.getElementById('budgetSrNumber').value;

            let filteredBudgets = savedBudgets;
            if (department) filteredBudgets = filteredBudgets.filter(b => b.department === department);
            if (planNumber) filteredBudgets = filteredBudgets.filter(b => b.planNumber === planNumber);
            if (budgetSrNumber) filteredBudgets = filteredBudgets.filter(b => b.budgetSrNumber === budgetSrNumber);

            if (filteredBudgets.length === 0) {
                alert('No data found for the selected criteria');
                return;
            }

            const ws = XLSX.utils.json_to_sheet(
                filteredBudgets.flatMap(budget => 
                    budget.entries.map(entry => ({
                        'Budget Sr. Number': budget.budgetSrNumber,
                        'Department': budget.department,
                        'Plan Number': budget.planNumber,
                        'GL Description': entry.glDescription,
                        'GL Code': entry.glCode,
                        '2024': entry.years[0],
                        '2025': entry.years[1],
                        '2026': entry.years[2],
                        '2027': entry.years[3],
                        '2028': entry.years[4],
                        '2029': entry.years[5]
                    }))
                )
            );

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Budget Data');
            XLSX.writeFile(wb, 'budget_data.xlsx');
        }

        async function loadBudgetData() {
            const budgetSrNumber = document.getElementById('modifyBudgetSrNumber').value;
            if (!budgetSrNumber) {
                alert('Please enter a Budget Sr. Number');
                return;
            }

            try {
                const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer cU3Bpb1ZjoVRFUrn9lCXbEM8cHm1',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        appSlug: 'budget-planning-123456',
                        action: 'read',
                        collection: 'budgets',
                        conditions: {
                            budgetSrNumber: budgetSrNumber
                        }
                    })
                });
                const result = await response.json();
                
                if (result.success && result.result.length > 0) {
                    const budgetData = result.result[0];
                    populateForm(budgetData);
                } else {
                    alert('No budget found with this Sr. Number');
                }
            } catch (error) {
                console.error('Error loading budget:', error);
                alert('Error loading budget data');
            }
        }

        function populateForm(budgetData) {
            document.getElementById('department').value = budgetData.department;
            document.getElementById('planNumber').value = budgetData.planNumber;
            
            removeAllRows();
            budgetData.entries.forEach(entry => {
                const tbody = document.getElementById('budgetEntries');
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="p-2">
                        <select class="gl-description w-full border rounded" onchange="updateGLCode(this)">
                            <option value="">Select GL Description</option>
                            ${Object.keys(glMapping).map(desc => 
                                `<option value="${desc}" ${desc === entry.glDescription ? 'selected' : ''}>${desc}</option>`
                            ).join('')}
                        </select>
                    </td>
                    <td class="p-2"><input type="text" class="gl-code w-full border rounded" value="${entry.glCode}" readonly></td>
                    ${entry.years.map(year => 
                        `<td class="p-2"><input type="number" class="year-input w-full border rounded" value="${year}" min="0"></td>`
                    ).join('')}
                    <td class="p-2">
                        <button onclick="removeRow(this)" class="text-red-500 hover:text-red-700">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // Add initial row
        addNewRow();
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
